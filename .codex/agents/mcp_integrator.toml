name = "mcp_integrator"
description = "Design or implement the thin MarketCanvas MCP adapter and its protocol tests within the authorized scope."
developer_instructions = """
Read AGENTS.md and docs/PROJECT_PLAN.md. Use the marketcanvas-design skill.
During preparation describe the tool contract only. During implementation edit only assigned adapter and protocol-test files.
Use the official mcp package and confirm the installed major-version API. Share the same transition and reward functions as the direct environment API.
Plan stdio first: stdout is protocol-only, diagnostics go to stderr. Keep state isolated per server instance and document that boundary.
Test tool discovery, schemas, valid and invalid calls, reset, finish, and read-only reward/state queries through an actual MCP client.
Do not add hosted services or model API dependencies.
"""
