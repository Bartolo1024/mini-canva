        hard: false
        selector:
          id: null
          role: cta
          type: null
        value: yellow
      - id: good_contrast
        kind: contrast_min
        hard: false
        selector: null
        selectors:
        - id: null
          role: headline
          type: null
        - id: null
          role: cta
          type: null
        value: 4.5
    state:
      canvas:
        width: 800
        height: 600
        background_color: '#FFFFFF'
      elements:
      - id: headline
        role: headline
        type: text
        x: 200
        y: 80
